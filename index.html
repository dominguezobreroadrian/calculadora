<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11131b" />
    <title>Calculadora KALI</title>
  </head>
  <body>
    <!-- Contenedor y tarjeta principal de la calculadora -->
    <main class="app-shell">
      <section id="calculadora" class="calculadora" aria-label="Calculadora">
        <!-- Cabecera: botón del logo y nombre de la calculadora -->
        <header class="cabecera">
          <button id="botonLogoArch" class="boton-logo" type="button" aria-label="Cambiar color del logo de Arch Linux">
            <img id="logoArch" class="logo" src="https://img.icons8.com/material-two-tone/48/FA5252/arch-linux.png" alt="Logo de Arch Linux" />
          </button>
          <div>
            <p class="marca">CALCULADORA</p>
            <h1 class="titulo">KALI</h1>
          </div>
        </header>

        <!-- Pantalla: expresión de la operación y resultado actual -->
        <div class="pantalla-contenedor" aria-live="polite" aria-atomic="true">
          <p id="expresion" class="pantalla-expresion"></p>
          <p id="pantalla" class="pantalla-valor">0</p>
        </div>

        <!-- Teclado completo: teclas avanzadas y filas de operaciones -->
        <div id="teclado" class="teclado">
          <!-- Teclas adicionales visibles al expandir la calculadora -->
          <div id="teclasAvanzadas" class="teclas-avanzadas">
            <button class="tecla tecla--avanzada" data-accion="constante" data-valor="pi" aria-label="Pi">π</button>
            <button class="tecla tecla--avanzada" data-accion="constante" data-valor="e" aria-label="Número e">e</button>
            <button class="tecla tecla--avanzada" data-accion="borrar-entrada" aria-label="Borrar entrada">CE</button>
            <button class="tecla tecla--avanzada" data-accion="retroceso" aria-label="Borrar último dígito">⌫</button>
          </div>

          <!-- Fila 1: borrar todo, cambiar signo, expandir y dividir -->
          <div class="fila-teclas">
            <button class="tecla tecla--control" data-accion="borrar-todo" aria-label="Borrar todo">AC</button>
            <button class="tecla tecla--control" data-accion="signo" aria-label="Cambiar signo">±</button>
            <button id="botonExpandir" class="tecla tecla--control tecla--expandir" data-accion="alternar" aria-label="Mostrar calculadora ampliada" aria-expanded="false" aria-controls="teclasAvanzadas">↑</button>
            <button class="tecla tecla--operador" data-accion="operador" data-valor="÷" aria-label="Dividir">÷</button>
          </div>

          <!-- Fila 2: números 7, 8, 9 y multiplicación -->
          <div class="fila-teclas">
            <button class="tecla tecla--numero" data-accion="digito" data-valor="7">7</button>
            <button class="tecla tecla--numero" data-accion="digito" data-valor="8">8</button>
            <button class="tecla tecla--numero" data-accion="digito" data-valor="9">9</button>
            <button class="tecla tecla--operador" data-accion="operador" data-valor="×" aria-label="Multiplicar">×</button>
          </div>

          <!-- Fila 3: números 4, 5, 6 y resta -->
          <div class="fila-teclas">
            <button class="tecla tecla--numero" data-accion="digito" data-valor="4">4</button>
            <button class="tecla tecla--numero" data-accion="digito" data-valor="5">5</button>
            <button class="tecla tecla--numero" data-accion="digito" data-valor="6">6</button>
            <button class="tecla tecla--operador" data-accion="operador" data-valor="−" aria-label="Restar">−</button>
          </div>

          <!-- Fila 4: números 1, 2, 3 y suma -->
          <div class="fila-teclas">
            <button class="tecla tecla--numero" data-accion="digito" data-valor="1">1</button>
            <button class="tecla tecla--numero" data-accion="digito" data-valor="2">2</button>
            <button class="tecla tecla--numero" data-accion="digito" data-valor="3">3</button>
            <button class="tecla tecla--operador" data-accion="operador" data-valor="+" aria-label="Sumar">+</button>
          </div>

          <!-- Fila 5: cero, decimal e igual -->
          <div class="fila-teclas">
            <button class="tecla tecla--numero tecla--ancha" data-accion="digito" data-valor="0">0</button>
            <button class="tecla tecla--numero" data-accion="decimal" aria-label="Coma decimal">.</button>
            <button class="tecla tecla--igual" data-accion="igual" aria-label="Igual">=</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
